<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Огородники</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#ece6d6;--panel:#f8f4e8;--fg:#2a2a20;--mut:#756f5c;--line:#cfc7ae;--acc:#3a5f3b;--acc-t:#fff;--hi:#dfe8d0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d1e18;--panel:#272820;--fg:#ece9dc;--mut:#a29f8e;--line:#3d3e33;--acc:#8fb98a;--acc-t:#16180f;--hi:#2e3a2b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1d1e18;--panel:#272820;--fg:#ece9dc;--mut:#a29f8e;--line:#3d3e33;--acc:#8fb98a;--acc-t:#16180f;--hi:#2e3a2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:16px 14px 40px}
h1{font:700 26px Georgia,serif;margin:6px 0 2px}
h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:20px 0 8px}
.sub{color:var(--mut);margin:0 0 14px}.c{text-align:center}.mut{color:var(--mut)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:10px}
.box.me{background:var(--hi);border-color:var(--acc)}
button{font:inherit;font-weight:600;border:1px solid var(--acc);border-radius:6px;padding:11px 14px;background:var(--acc);color:var(--acc-t);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border-color:var(--line)}
button.sm{padding:6px 10px;font-size:14px}button.wide{width:100%;margin-bottom:8px}
button:disabled{opacity:.4;cursor:default}
input{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cards{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;min-height:104px}
.cd{flex:none;width:84px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 4px;text-align:center;font:13px Georgia,serif;color:var(--fg)}
.cd svg,.cd img{width:52px;height:52px;display:block;margin:0 auto 2px;object-fit:cover;border-radius:4px}
.cd small{display:block;color:var(--mut);font:11px system-ui,sans-serif}
.cd.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc);cursor:pointer}
.mini{display:flex;gap:2px;flex-wrap:wrap;margin-top:4px}.mini svg,.mini img{width:24px;height:24px;object-fit:cover;border-radius:3px}
.turn{padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-weight:600;margin-bottom:8px}
.turn.me{background:var(--acc);border-color:var(--acc);color:var(--acc-t)}
.log{color:var(--mut);font-size:14px;margin:0 0 10px}.log div{margin:2px 0}
.big{font:700 40px Georgia,serif;letter-spacing:.12em;margin:4px 0}
details{font-size:14px;color:var(--mut)}summary{cursor:pointer;color:var(--fg);font-weight:600}details p{margin:8px 0 0}
.foot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.pts{font-weight:700}
</style>
</head>
<body>
<div id="app"><p class="c mut" style="margin-top:40px">Подключаюсь…</p></div>
<audio id="mu" src="music.mp3" loop></audio>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const FB_CONFIG={apiKey:"AIzaSyAf-p4_oIVeAgjOqtUD5e0B_AoSMfRCAnY",authDomain:"ogorodniki.firebaseapp.com",databaseURL:"https://ogorodniki-default-rtdb.europe-west1.firebasedatabase.app",projectId:"ogorodniki",storageBucket:"ogorodniki.firebasestorage.app",messagingSenderId:"903724736532",appId:"1:903724736532:web:71af1f8f75b8d386eec701"};
const VER=3;
/* карта: [название, тип, очки, подпись]  типы: p растение, h теплица, s пугало, v вредитель, m кроты, t кража */
const CD={a:['Морковь','p',1,'1 очко'],b:['Томат','p',2,'2 очка'],c:['Капуста','p',2,'2 очка'],d:['Тыква','p',3,'3 очка'],s:['Пугало','s',0,'защита'],v:['Слизни','v',0,'вредитель'],w:['Ворона','v',0,'вредитель'],m:['Кроты','m',0,'атака'],t:['Кража','t',0,'украсть'],h:['Теплица','h',0,'+2 очка']};
const CNT={a:5,b:4,c:4,d:3,s:4,v:4,w:2,m:3,t:2,h:3};
const AR={a:'<path d="M28 14L39 52L17 52Z" fill="#d9772b"/><path d="M28 14L21 4M28 14L35 4" stroke="#4f8a3c" stroke-width="3"/>',
b:'<circle cx="28" cy="33" r="18" fill="#c8402f"/><path d="M18 18L28 24L38 18L33 28L23 28Z" fill="#4f8a3c"/>',
c:'<circle cx="28" cy="30" r="20" fill="#7fae5a"/><path d="M12 30Q28 10 44 30M16 40Q28 24 40 40" stroke="#4f7a3a" stroke-width="2" fill="none"/>',
d:'<ellipse cx="28" cy="34" rx="22" ry="16" fill="#d98a2b"/><path d="M28 18V8" stroke="#4f8a3c" stroke-width="4"/><path d="M20 20Q28 40 36 20" stroke="#b36d1a" fill="none" stroke-width="2"/>',
s:'<path d="M28 12V52M8 26H48" stroke="#7a5230" stroke-width="4"/><circle cx="28" cy="18" r="7" fill="#e6c98f"/><path d="M18 14H38L28 3Z" fill="#5b3b22"/>',
v:'<path d="M6 42Q6 28 22 30Q38 28 50 42Z" fill="#8c7a5b"/><path d="M40 33L44 20M47 35L54 24" stroke="#8c7a5b" stroke-width="2.5"/>',
w:'<ellipse cx="26" cy="30" rx="18" ry="12" fill="#2b2b33"/><path d="M42 26L54 28L42 32Z" fill="#c9a23a"/><circle cx="38" cy="25" r="2" fill="#fff"/>',
m:'<path d="M4 48Q28 14 52 48Z" fill="#8a6a4a"/><circle cx="28" cy="36" r="6" fill="#4a3a2a"/><circle cx="26" cy="35" r="1.5" fill="#fff"/>',
t:'<path d="M17 22Q28 6 39 22L45 50L11 50Z" fill="#8a6b3f"/><path d="M20 24H36" stroke="#5a4528" stroke-width="3"/>',
h:'<path d="M6 28L28 8L50 28V50H6Z" fill="#bcd8cf" stroke="#3a5f3b" stroke-width="2"/><path d="M28 8V50M6 38H50" stroke="#3a5f3b"/>'};
const art=c=>'<svg viewBox="0 0 56 56">'+AR[c]+'</svg><img src="card-'+c+'.png" alt="" onload="this.previousSibling.remove()" onerror="this.remove()">';
let S=null,me='',nm='',code='',status='',ref=null,db=null,inRoom=false,first=false,dirty=false,joinTimer=null,sel=null,ac=null;
try{nm=localStorage.getItem('gn-nm')||'';me=localStorage.getItem('gn-id')||''}catch(e){}
if(!me){me='u'+Math.random().toString(36).slice(2,10);try{localStorage.setItem('gn-id',me)}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const save=()=>{dirty=true};
const cur=()=>S.players[S.t];
const mine=()=>S&&S.phase==='play'&&cur().id===me;
const score=p=>{let s=p.b,k={};p.g.forEach(c=>{const d=CD[c];if(d[1]==='p'){s+=d[2];k[c]=(k[c]||0)+1}else s+=2});for(const c in k)s+=3*Math.floor(k[c]/3);return s};
const F={};
function tone(f){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.18);o.stop(ac.currentTime+.18)}catch(e){}}
function mus(){const a=$('#mu');a.paused?a.play().catch(()=>{}):a.pause()}
const SN={};
function snd(n){try{const a=SN[n]||(SN[n]=new Audio('snd-'+n+'.mp3'));a.currentTime=0;a.play().catch(()=>tone(520))}catch(e){}}
function sound(){const e=S.ev;if(e)snd(e==='pest'?'laugh':e);if(S.hu===me)setTimeout(()=>snd('hurt'),e==='pest'?3200:600)}

/* ---------- Связь через Firebase ---------- */
function dbOk(){
 if(typeof firebase==='undefined'){status='Нужен интернет';render();return false}
 if(!db){firebase.initializeApp(FB_CONFIG);db=firebase.database()}
 return true}
function act(a,...args){
 if(!ref||!F[a])return;
 ref.transaction(raw=>{
  if(raw===null)return raw;
  const prev=S;let out;
  try{S=JSON.parse(raw);dirty=false;F[a](...args);out=dirty?JSON.stringify(S):undefined}catch(e){out=undefined}
  S=prev;return out},
  err=>{if(err){status='Ошибка связи';render()}})}
function listen(c){
 code=c;inRoom=true;S=null;status='Подключаюсь…';first=true;render();
 clearTimeout(joinTimer);
 joinTimer=setTimeout(()=>{if(first)fail('Не получилось подключиться. Проверь код и интернет.')},15000);
 ref=db.ref('rooms/'+c+'/state');
 ref.on('value',snap=>{
  const v=snap.val();
  if(v===null){fail(first?'Комната с таким кодом не найдена.':'Комната удалена.');return}
  const d=JSON.parse(v);
  if(d.v!==VER){fail('Это комната из старой версии игры. Создай новую.');return}
  const pn=S?S.n:null;S=d;
  if(pn!==null&&pn!==S.n)sound();
  if(first){
   first=false;clearTimeout(joinTimer);
   if(!S.players.some(p=>p.id===me)){
    if(S.phase==='lobby')act('join',nm);
    else{fail('Игра уже идёт, присоединиться нельзя.');return}
   }
   try{localStorage.setItem('gn-room',c)}catch(e){}
  }
  render()},
  e=>fail('Ошибка связи: '+((e&&e.code)||'')))}
function leave(keep){
 clearTimeout(joinTimer);try{ref&&ref.off()}catch(e){}
 ref=null;inRoom=false;first=false;S=null;sel=null;
 try{localStorage.removeItem('gn-room')}catch(e){}
 if(!keep)status='';
 render()}
function fail(t){status=t;leave(true)}
function remember(n){nm=n;try{localStorage.setItem('gn-nm',n)}catch(e){}}
function hostGame(){
 const n=$('#nm').value.trim().slice(0,14);if(!n)return;
 if(!dbOk())return;
 remember(n);status='Создаю комнату…';render();tryCreate(0)}
function tryCreate(i){
 if(i>10){status='Не получилось создать комнату. Попробуй ещё раз.';render();return}
 const c=String(Math.random()*90000+10000|0);
 db.ref('rooms/'+c+'/state').transaction(
  cur=>cur===null?JSON.stringify({v:VER,phase:'lobby',players:[],n:0}):undefined,
  (err,ok)=>{
   if(err){status='Ошибка связи. Проверь правила базы и интернет.';render();return}
   if(!ok){tryCreate(i+1);return}
   listen(c)},false)}
function joinGame(){
 const n=$('#nm').value.trim().slice(0,14),c=$('#code').value.trim();
 if(!n||!c)return;if(!dbOk())return;remember(n);listen(c)}

/* ---------- Правила игры ---------- */
function join(n){if(!S||S.phase!=='lobby')return;if(!S.players.some(p=>p.id===me)&&S.players.length<4)S.players.push({id:me,name:String(n).slice(0,14)});save()}
function start(){if(!S||!S.players.some(p=>p.id===me)||S.players.length<2)return;
 const d=[];for(const k in CNT)for(let i=0;i<CNT[k];i++)d.push(k);shuf(d);
 const pk=()=>d.splice(d.findIndex(c=>CD[c][1]!=='v'),1)[0];
 S.players=S.players.map(p=>({id:p.id,name:p.name,h:[pk(),pk(),pk()],g:[],b:0}));
 S.deck=d;S.t=0;S.dr=0;S.pl=0;S.phase='play';S.log=['Игра началась.'];ev('draw');S.n++;save()}
function reset(){if(!S)return;S={v:VER,phase:'lobby',players:[],n:(S.n||0)+1};save()}
function ev(e,h){S.ev=e;S.hu=h||''}
function lg(m){S.log.push(m);if(S.log.length>5)S.log.shift()}
function loseP(p){const ix=p.g.map((c,i)=>CD[c][1]==='p'?i:-1).filter(i=>i>=0);if(!ix.length)return null;return p.g.splice(ix[Math.random()*ix.length|0],1)[0]}
function guard(p){const i=p.h.indexOf('s');if(i<0)return false;p.h.splice(i,1);return true}
function nextT(){S.t=(S.t+1)%S.players.length;S.dr=0;S.pl=0}
function over(m){S.phase='over';S.msg=m;ev('end');S.n++;save()}
function draw(){if(!mine()||S.dr)return;const p=cur();
 if(!S.deck.length){over('Колода закончилась.');return}
 const c=S.deck.pop();S.dr=1;
 if(CD[c][1]==='v'){
  if(guard(p)){lg(p.name+': '+CD[c][0]+' отпугнуты Пугалом.');ev('block')}
  else{const l=loseP(p);ev('pest',l?p.id:'');lg(p.name+': '+CD[c][0]+(l?' съели «'+CD[l][0]+'».':' ничего не нашли.'))}
 }else{p.h.push(c);if(p.h.length>6)p.h.shift();lg(p.name+' берёт карту.');ev('draw')}
 S.n++;save()}
function play(i,ti){if(!mine()||!S.dr||S.pl>=2)return;const p=cur(),c=p.h[i];if(!c)return;const k=CD[c][1];
 if(k==='p'||k==='h'){if(p.g.length>=8)return;p.g.push(c);p.h.splice(i,1);lg(p.name+' сажает: '+CD[c][0]+'.');ev('plant')}
 else if(k==='m'||k==='t'){const v=S.players[ti];if(!v||v===p)return;p.h.splice(i,1);
  if(guard(v)){lg(v.name+' отбивается Пугалом от «'+CD[c][0]+'».');ev('block')}
  else{const l=loseP(v);
   if(k==='m'){lg(p.name+': кроты съели у '+v.name+(l?' «'+CD[l][0]+'».':' ничего.'));ev('mole',l?v.id:'')}
   else if(l&&p.g.length<8){p.g.push(l);lg(p.name+' крадёт у '+v.name+' «'+CD[l][0]+'».');ev('steal',v.id)}
   else{lg(p.name+' пытался украсть у '+v.name+', но зря.');ev('steal')}}}
 else return;
 S.pl++;S.n++;save()}
function end(){if(!mine()||!S.dr)return;ev('');nextT();S.n++;save()}
function harvest(){if(!mine()||S.dr)return;const p=cur(),sc=score(p);
 if(S.players.every(q=>q===p||score(q)<sc)){p.b=3;over('«Урожай!» '+p.name+' собирает урожай и получает +3 очка.');return}
 const l=loseP(p);lg(p.name+' поспешил(а) с «Урожаем!» и теряет '+(l?'«'+CD[l][0]+'»':'ничего')+'.');ev('',l?p.id:'');nextT();S.n++;save()}
Object.assign(F,{join,start,reset,draw,play,end,harvest});
function tapCard(i){const me2=S.players.find(x=>x.id===me),k=CD[me2.h[i]][1];
 if(k==='p'||k==='h')act('play',i,0);else if(k==='m'||k==='t'){sel=i;render()}}
function pickT(ti){const i=sel;sel=null;act('play',i,ti)}
function harvestAsk(){if(confirm('Закончить игру «Урожаем»? Если у кого-то очков не меньше, вы потеряете растение.'))act('harvest')}

/* ---------- Отрисовка ---------- */
const rules='<details><summary>Правила</summary><p>В свой ход: 1) возьми карту из колоды; 2) сыграй до двух карт; 3) закончи ход. Растения и теплицы садишь в свой огород (до 8 штук). Кроты съедают случайное растение соперника, Кража забирает его себе.</p><p>Если из колоды пришёл вредитель, он съедает твоё растение. Пугало в руке защищает от вредителей, кротов и кражи (расходуется само).</p><p>Очки: растения (морковь 1, томат и капуста 2, тыква 3), +3 за каждые 3 одинаковых растения, +2 за теплицу. «Урожай!» вместо взятия карты: если у вас строго больше очков, чем у всех, игра заканчивается, и вы получаете +3. Иначе теряете растение. Игра также заканчивается, когда кончается колода.</p></details>';
const card=(c,cls,fn)=>'<div class="cd '+(cls||'')+'"'+(fn?' onclick="'+fn+'"':'')+'>'+art(c)+CD[c][0]+'<small>'+CD[c][3]+'</small></div>';
function render(){const a=$('#app');
 if(!inRoom){a.innerHTML='<h1>Огородники</h1><p class="sub">Карточная игра на 2–4 человека</p><div class="box"><input id="nm" maxlength="14" placeholder="Ваше имя" value="'+esc(nm)+'"><button class="wide" onclick="hostGame()">Создать игру</button></div><div class="box"><p class="mut" style="margin:0 0 10px">Или войти в игру друга:</p><input id="code" inputmode="numeric" placeholder="Код комнаты"><button class="wide alt" onclick="joinGame()">Войти по коду</button></div><p class="log c">'+esc(status)+'</p><div class="box">'+rules+'</div>';return}
 if(!S){a.innerHTML='<h1>Огородники</h1><p class="sub">'+esc(status||'Подключаюсь…')+'</p><p><button class="alt sm" onclick="leave()">Отмена</button></p>';return}
 const foot='<div class="foot"><button class="alt sm" onclick="mus()">Музыка</button><button class="alt sm" onclick="act(\'reset\')">Сбросить игру</button><button class="alt sm" onclick="leave()">Выйти в меню</button></div>';
 if(S.phase==='lobby'){const ps=S.players,j=ps.some(p=>p.id===me);
  a.innerHTML='<h1>Огородники</h1><p class="sub">Лобби</p><div class="box c"><div class="mut">Код комнаты</div><div class="big">'+esc(code)+'</div><div class="mut" style="font-size:14px">Назовите код остальным игрокам</div></div><div class="box"><b>Игроки ('+ps.length+' из 4)</b><div style="margin:8px 0">'+(ps.map(p=>'<div>'+esc(p.name)+(p.id===me?' (вы)':'')+'</div>').join('')||'<span class="mut">Пока никого</span>')+'</div>'+
   (!j&&ps.length<4?'<button class="wide" onclick="act(\'join\',nm)">Войти в игру</button>':'')+
   (j?'<button class="wide" onclick="act(\'start\')"'+(ps.length<2?' disabled':'')+'>Начать игру</button><p class="mut" style="margin:0">'+(ps.length<2?'Ждём остальных игроков…':'Можно начинать.')+'</p>':'')+'</div><div class="box">'+rules+'</div>'+foot;return}
 if(S.phase==='over'){const r=S.players.slice().sort((x,y)=>score(y)-score(x));
  a.innerHTML='<h1>Игра окончена</h1><p class="sub">Победитель: '+esc(r[0].name)+'. '+esc(S.msg||'')+'</p><div class="box">'+r.map((p,i)=>'<div class="row" style="padding:4px 0"><span>'+(i+1)+'. '+esc(p.name)+'</span><span class="pts">'+score(p)+'</span></div>').join('')+'</div><button class="wide" onclick="act(\'start\')">Сыграть ещё раз</button>'+foot;return}
 const my=mine(),p=cur(),mp=S.players.find(x=>x.id===me),ok=my&&S.dr&&S.pl<2;
 let h='<h1>Огородники</h1><p class="sub">Карт в колоде: '+S.deck.length+'</p><div class="turn'+(my?' me':'')+'">'+(my?(S.dr?'Ваш ход: сыграйте карты ('+S.pl+' из 2) или закончите ход':'Ваш ход: возьмите карту'):'Ходит: '+esc(p.name))+'</div>';
 h+='<div class="log">'+S.log.map(m=>'<div>'+esc(m)+'</div>').join('')+'</div>';
 if(my)h+=(!S.dr?'<button class="wide" onclick="act(\'draw\')">Взять карту</button><button class="wide alt" onclick="harvestAsk()">Урожай! (закончить игру)</button>':'<button class="wide" onclick="act(\'end\')">Закончить ход</button>');
 if(sel!==null)h+='<div class="box"><b>Выберите цель</b><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">'+S.players.map((q,i)=>q.id===me?'':'<button class="sm" onclick="pickT('+i+')">'+esc(q.name)+'</button>').join('')+'<button class="sm alt" onclick="sel=null;render()">Отмена</button></div></div>';
