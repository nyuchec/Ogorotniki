<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Огородники</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg1:#cfeaf7;--bg2:#e3f3c9;--bg3:#b9dc8c;--fg:#1f3320;--card:#ffffffee;--mut:#5f7358;--line:#c6dbb4;--acc:#3f9b3a;--acc2:#2f7d2c;--soil:#7a4f2b;--soil2:#5e3b1f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg1:#14222c;--bg2:#17261a;--bg3:#1d3318;--fg:#eef6e8;--card:#202c1eee;--mut:#a3b89b;--line:#33462e;--soil:#6b4526;--soil2:#4d3019}}
:root[data-theme="dark"]{color-scheme:dark;--bg1:#14222c;--bg2:#17261a;--bg3:#1d3318;--fg:#eef6e8;--card:#202c1eee;--mut:#a3b89b;--line:#33462e;--soil:#6b4526;--soil2:#4d3019}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--fg);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;background:linear-gradient(180deg,var(--bg1) 0,var(--bg2) 220px,var(--bg3) 100%) fixed}
#app{max-width:520px;margin:0 auto;padding:12px 12px 30px}
h1{font-size:22px;margin:4px 0 12px;text-align:center;font-weight:800;letter-spacing:.3px;text-shadow:0 1px 0 #fff6}
h2{font-size:15px;margin:16px 0 8px;font-weight:800}
.c{text-align:center;color:var(--mut)}
.box{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:0 4px 14px #0000001a;animation:in .35s ease both}
.box.on{border-color:var(--acc);box-shadow:0 0 0 3px #3f9b3a44,0 4px 14px #0000001a;animation:glow 1.6s ease-in-out infinite alternate}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes glow{to{box-shadow:0 0 0 6px #3f9b3a22,0 4px 14px #0000001a}}
button{font:inherit;border:0;border-radius:14px;padding:12px 16px;background:linear-gradient(180deg,var(--acc),var(--acc2));color:#fff;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #1f5a1d,0 5px 10px #0003;transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #1f5a1d}
button.alt{background:linear-gradient(180deg,#fff,#e8efe1);color:var(--fg);box-shadow:0 3px 0 var(--line),0 5px 10px #0002}
button.sm{padding:7px 12px;font-size:13px;font-weight:600}
button:disabled{opacity:.45;box-shadow:none}
input{font:inherit;width:100%;padding:13px;border-radius:14px;border:2px solid var(--line);background:#fff;color:#223;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.hd b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;margin-right:8px;flex:none}
.who{display:flex;align-items:center;min-width:0}
.sc{font-weight:800;background:#ffe9a6;color:#5a4300;border-radius:12px;padding:3px 10px;white-space:nowrap}
.rsr{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.rs{background:#fff;color:#223;border:1px solid var(--line);border-radius:12px;padding:2px 10px;font-weight:700}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{border:2px solid var(--line);border-radius:16px;padding:10px 8px;color:#1f2a1c;text-align:center;cursor:pointer;min-height:96px;box-shadow:0 3px 0 #0002;transition:transform .1s}
.pl.pW{background:linear-gradient(160deg,#d6efff,#a9d8f7)}
.pl.pG{background:linear-gradient(160deg,#e3f7c9,#b9e48a)}
.pl.pC{background:linear-gradient(160deg,#f0dcc3,#d3b08a)}
.pl.pL{background:linear-gradient(160deg,#ffe8c2,#ffc77a)}
.pl.pF{background:linear-gradient(160deg,#f1ddff,#d3a8f2)}
.pl.pR{background:linear-gradient(160deg,#dcdcea,#a9a9c4)}
.pl.hl{border-color:var(--acc);box-shadow:0 0 0 3px #3f9b3a66,0 3px 0 #0002;animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.pl.full{filter:grayscale(.7) opacity(.7);cursor:default;animation:none}
.pl big{font-size:32px;display:block;line-height:1.2}
.pl b{display:block}
.pl small{display:block;color:#4b5a45;font-size:12px}
.pl i{font-style:normal;font-size:11px;font-weight:700;background:#1f2a1c;color:#fff;border-radius:10px;padding:1px 7px;margin:2px 1px 0;display:inline-block}
.mk{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.cd{flex:0 0 96px;border:2px solid #d8caa0;border-radius:14px;background:linear-gradient(180deg,#fffdf3,#f6ecc9);color:#2a2418;text-align:center;padding:8px 4px;font-size:12px;box-shadow:0 3px 0 #0002}
.cd big{font-size:34px;display:block;line-height:1.2}
.cd .pr{display:inline-block;background:#fff;border:1px solid #d8caa0;border-radius:10px;padding:0 6px;margin:3px 0;font-weight:700}
.cd.ok{border-color:var(--acc);box-shadow:0 0 0 3px #3f9b3a77,0 3px 0 #0002;cursor:pointer;animation:bob 1s ease-in-out infinite alternate}
.cd.no{opacity:.45}
.msg{text-align:center;color:var(--mut);min-height:20px;margin:6px 0;font-weight:600}
.turn{text-align:center;font-weight:800;margin:6px 0;padding:8px;border-radius:14px;background:#ffffffb0;color:#1f3320}
details{font-size:14px;color:var(--mut)}
summary{cursor:pointer;font-weight:700;color:var(--fg)}
.gd{font-size:26px;letter-spacing:3px;min-height:44px;margin-top:6px;padding:4px 8px;border-radius:12px;background:repeating-linear-gradient(90deg,var(--soil) 0 12px,var(--soil2) 12px 14px);color:#fff;display:flex;align-items:center;flex-wrap:wrap}
.gd .e{color:#e9dcc8;font-size:13px;letter-spacing:0}
.seas{display:inline-block;animation:bob 1.4s ease-in-out infinite alternate}
</style>
</head>
<body>
<div id="app"><p class="c" style="margin-top:40px">Подключаюсь…</p></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const FB_CONFIG={
  apiKey:"AIzaSyAf-p4_oIVeAgjOqtUD5e0B_AoSMfRCAnY",
  authDomain:"ogorodniki.firebaseapp.com",
  databaseURL:"https://ogorodniki-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"ogorodniki",
  storageBucket:"ogorodniki.firebasestorage.app",
  messagingSenderId:"903724736532",
  appId:"1:903724736532:web:71af1f8f75b8d386eec701"
};
const RN=['🌱','💧','🍂'];
const CARDS={a:['🥕','Морковь',[1,0,0],1,[1,0,0]],b:['🥬','Капуста',[1,1,0],1,[0,1,0]],c:['🌽','Кукуруза',[2,1,0],2,[0,0,1]],d:['🍅','Томат',[2,2,0],2,[1,1,0]],e:['🎃','Тыква',[1,1,2],4,[0,0,0]],f:['🍓','Клубника',[0,2,1],2,[0,1,1]],g:['🌻','Подсолнух',[2,0,1],3,[1,0,0]],h:['🐝','Улей',[2,2,2],1,[1,1,1]]};
const PL={W:['💧','Колодец','+2 💧',2],G:['🌱','Грядка семян','+2 🌱',2],C:['🍂','Компост','+2 🍂',2],L:['🛒','Лавка','купить растение',2],F:['🎪','Ярмарка','🌱💧🍂 → 3 ⭐',1],R:['🐦','Ворона','украсть ресурс',1]};
const RI={W:1,G:0,C:2};
const SEAS=['Весна','Лето','Осень','Зима'],WK=[2,2,3,3];
let S=null,me='',pend=null,note='',nm='',code='',status='',ref=null,db=null,inRoom=false,first=false,dirty=false,joinTimer=null;
try{nm=localStorage.getItem('gn-nm')||'';me=localStorage.getItem('gn-id')||''}catch(e){}
if(!me){me='u'+Math.random().toString(36).slice(2,10);try{localStorage.setItem('gn-id',me)}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const save=()=>{dirty=true};
const cur=()=>S.players[S.turn];
const mine=()=>S&&S.phase==='play'&&cur().id===me;
const sum=a=>a.reduce((x,y)=>x+y,0);
const cs=a=>a.map((x,j)=>x?x+RN[j]:'').filter(Boolean).join(' ')||'—';
const afford=(p,c)=>CARDS[c][2].every((x,j)=>p.res[j]>=x);
const score=p=>p.pts+sum(p.garden.map(c=>CARDS[c][3]))+Math.floor(sum(p.res)/3);
const nameOf=id=>(S.players.find(p=>p.id===id)||{name:'?'}).name;
const F={};

/* ---------- Связь через Firebase ---------- */
/* Состояние игры хранится в базе как одна JSON-строка: rooms/КОД/state.
   Каждое действие игрока выполняется транзакцией, поэтому хозяин игры не нужен,
   а одновременные ходы не ломают друг друга. */
function dbOk(){
 if(typeof firebase==='undefined'){status='Нужен интернет';render();return false}
 if(!db){firebase.initializeApp(FB_CONFIG);db=firebase.database()}
 return true}
function act(a,...args){
 if(!ref||!F[a])return;
 ref.transaction(raw=>{
  if(raw===null)return raw;
  const prev=S,pp=pend,pn=note;
  let out;
  try{S=JSON.parse(raw);dirty=false;F[a](...args);out=dirty?JSON.stringify(S):undefined}
  catch(e){out=undefined}
  S=prev;pend=pp;note=pn;
  return out},
  err=>{if(err){status='Ошибка связи';render()}})}
function listen(c){
 code=c;inRoom=true;S=null;status='Подключаюсь…';first=true;render();
 clearTimeout(joinTimer);
 joinTimer=setTimeout(()=>{if(first)fail('Не получилось подключиться. Проверь код и интернет.')},15000);
 ref=db.ref('rooms/'+c+'/state');
 ref.on('value',snap=>{
  const v=snap.val();
  if(v===null){fail(first?'Комната с таким кодом не найдена.':'Комната удалена.');return}
  S=JSON.parse(v);
  if(first){
   first=false;clearTimeout(joinTimer);
   if(!S.players.some(p=>p.id===me)){
    if(S.phase==='lobby')act('join',nm);
    else{fail('Игра уже идёт, присоединиться нельзя.');return}
   }
   try{localStorage.setItem('gn-room',c)}catch(e){}
  }
  render()},
  e=>fail('Ошибка связи: '+((e&&e.code)||'')))}
function leave(keep){
 clearTimeout(joinTimer);
 try{ref&&ref.off()}catch(e){}
 ref=null;inRoom=false;first=false;S=null;pend=null;note='';
 try{localStorage.removeItem('gn-room')}catch(e){}
 if(!keep)status='';
 render()}
function fail(t){status=t;leave(true)}
function remember(n){nm=n;try{localStorage.setItem('gn-nm',n)}catch(e){}}
function hostGame(){
 const n=$('#nm').value.trim().slice(0,14);if(!n)return;
 if(!dbOk())return;
 remember(n);status='Создаю комнату…';render();tryCreate(0)}
function tryCreate(i){
 if(i>10){status='Не получилось создать комнату. Попробуй ещё раз.';render();return}
 const c=String(Math.random()*90000+10000|0);
 db.ref('rooms/'+c+'/state').transaction(
  cur=>cur===null?JSON.stringify({phase:'lobby',players:[]}):undefined,
  (err,ok)=>{
   if(err){status='Ошибка связи. Проверь правила базы и интернет.';render();return}
   if(!ok){tryCreate(i+1);return}
   listen(c)},
  false)}
function joinGame(){
 const n=$('#nm').value.trim().slice(0,14),c=$('#code').value.trim();
 if(!n||!c)return;
 if(!dbOk())return;
 remember(n);listen(c)}

/* ---------- Правила игры ---------- */
function join(n){if(!S||S.phase!=='lobby')return;if(!S.players.some(p=>p.id===me)&&S.players.length<4)S.players.push({id:me,name:String(n).slice(0,14)});save()}
function start(){if(!S||!S.players.some(p=>p.id===me)||S.players.length<2)return;const d=[];for(const k of Object.keys(CARDS))for(let i=0;i<4;i++)d.push(k);shuf(d);
 S.deck=d;S.market=d.splice(0,5);S.season=1;S.turn=0;S.msg='Игра началась! Весна 🌸';S.places={W:[],G:[],C:[],L:[],F:[],R:[]};
 S.players=S.players.map(p=>({id:p.id,name:p.name,res:[1,1,1],garden:[],pts:0,w:WK[0],pass:0}));S.phase='play';pend=null;note='';save()}
function reset(){if(!S)return;S={phase:'lobby',players:[]};pend=null;save()}
function next(m){pend=null;note='';S.msg=m;const n=S.players.length;
 for(let k=1;k<=n;k++){const q=(S.turn+k)%n,p=S.players[q];if(p.w>0&&!p.pass){S.turn=q;save();return}}
 S.players.forEach(p=>p.garden.forEach(c=>CARDS[c][4].forEach((v,j)=>p.res[j]+=v)));
 if(S.season>=4){S.phase='over';save();return}
 S.season++;S.places={W:[],G:[],C:[],L:[],F:[],R:[]};S.players.forEach(p=>{p.w=WK[S.season-1];p.pass=0});S.turn=(S.season-1)%n;
 S.msg=m+' · Урожай собран! Наступает '+SEAS[S.season-1];save()}
function put(k,m){const p=cur();S.places[k].push(p.id);p.w--;next(p.name+': '+m)}
function place(k){if(!mine())return;const p=cur();if(S.places[k].length>=PL[k][3]||p.w<1)return;
 if(RI[k]!=null){p.res[RI[k]]+=2;put(k,PL[k][2])}
 else if(k==='F'&&p.res.every(x=>x>0)){p.res=p.res.map(x=>x-1);p.pts+=3;put(k,'ярмарка, +3 ⭐')}}
function tapPlace(k){if(!mine()||pend||S.places[k].length>=PL[k][3])return;const p=cur();
 if(k==='L'||k==='R'){pend=k;note='';render();return}
 if(k==='F'&&!p.res.every(x=>x>0)){note='Для ярмарки нужен хотя бы 1 ресурс каждого вида';render();return}
 note='';act('place',k)}
function buy(i){if(!mine())return;const p=cur(),c=S.market[i];if(!c||p.w<1||S.places.L.length>=PL.L[3]||!afford(p,c)||p.garden.length>=8)return;
 p.res=p.res.map((x,j)=>x-CARDS[c][2][j]);p.garden.push(c);
 if(S.deck.length)S.market[i]=S.deck.pop();else S.market.splice(i,1);put('L','посадил(а) '+CARDS[c][0])}
function tapBuy(i){if(pend!=='L')return;pend=null;act('buy',i);render()}
function steal(pi){if(!mine())return;const p=cur(),v=S.players[pi];if(!v||v===p||p.w<1||S.places.R.length>=PL.R[3])return;const t=sum(v.res);if(!t)return;
 let r=Math.random()*t|0,j=0;while(r>=v.res[j]){r-=v.res[j];j++}
 v.res[j]--;p.res[j]++;put('R','ворона украла '+RN[j]+' у '+v.name)}
function tapSteal(pi){if(pend!=='R')return;pend=null;act('steal',pi);render()}
function cancel(){pend=null;render()}
function pass(){if(!mine())return;const p=cur();p.pass=1;next(p.name+' пасует')}
Object.assign(F,{join,start,reset,place,buy,steal,pass});
const doStart=()=>act('start'),doReset=()=>act('reset'),doPass=()=>act('pass'),doJoin=()=>act('join',nm);

/* ---------- Отрисовка ---------- */
const rules='<details open><summary>Правила</summary><p>Игра идёт 4 сезона. В свой ход ставишь помощника 🧑‍🌾 на одно место на поле (в сезоне у всех 2–3 помощника). Когда помощники закончились или ты нажал «Пас», ты ждёшь остальных.</p><p>💧 Колодец, 🌱 Грядка и 🍂 Компост дают по 2 ресурса (по 2 места). 🛒 Лавка: купи растение, оно сразу попадёт в твой огород (до 8). 🎪 Ярмарка: отдай по 1 ресурсу каждого вида и получи 3 ⭐. 🐦 Ворона: украдёт 1 случайный ресурс у выбранного соседа.</p><p>В конце каждого сезона 🧺 урожай: каждое растение в огороде приносит свои ресурсы. Очки: ⭐ растений и ярмарки, плюс 1 ⭐ за каждые 3 неистраченных ресурса. Победит тот, у кого больше ⭐ после Зимы.</p></details>';
function playerBox(p,i){const ac=S.phase==='play'&&cur()===p;
 return '<div class="box'+(ac?' on':'')+'"><div class="hd"><span class="who"><span class="av" style="background:hsl('+(([...p.id].reduce((s,ch)=>s+ch.charCodeAt(0),0)*47)%360)+',55%,45%)">'+esc(p.name.slice(0,1).toUpperCase())+'</span><b>'+esc(p.name)+(p.id===me?' (ты)':'')+'</b></span><span class="sc">⭐ '+score(p)+'</span></div><div class="rsr">'+p.res.map((x,j)=>'<span class="rs">'+RN[j]+' '+x+'</span>').join('')+'<span class="rs">🧑‍🌾 '+p.w+(p.pass?' · пас':'')+'</span></div><div class="gd">'+(p.garden.map(c=>CARDS[c][0]).join('')||'<span class="e">огород пуст</span>')+'</div>'+
  (pend==='R'&&mine()&&p.id!==me?'<button class="sm" style="margin-top:6px"'+(sum(p.res)?' onclick="tapSteal('+i+')"':' disabled')+'>🐦 Украсть у '+esc(p.name)+'</button>':'')+'</div>'}
function render(){const a=$('#app');
 if(!inRoom){a.innerHTML='<h1>🥕 Огородники</h1><div class="box"><input id="nm" maxlength="14" placeholder="Твоё имя" value="'+esc(nm)+'"><button onclick="hostGame()" style="width:100%">Создать игру</button><p class="c">или войди в игру друга:</p><input id="code" inputmode="numeric" placeholder="Код комнаты"><button class="alt" onclick="joinGame()" style="width:100%">Войти по коду</button><p class="msg">'+esc(status)+'</p></div><div class="box">'+rules+'</div>';return}
 if(!S){a.innerHTML='<h1>🥕 Огородники</h1><p class="c">'+esc(status||'Подключаюсь…')+'</p><p class="c"><button class="alt sm" onclick="leave()">Отмена</button></p>';return}
 const foot='<p class="c"><button class="alt sm" onclick="doReset()">Сбросить игру</button> <button class="alt sm" onclick="leave()">Выйти в меню</button></p>';
 if(S.phase==='lobby'){const ps=S.players,j=ps.some(p=>p.id===me);
  a.innerHTML='<h1>🥕 Огородники</h1><div class="box c">Код комнаты<div style="font-size:36px;font-weight:800;color:var(--fg);letter-spacing:4px">'+esc(code)+'</div><small>Назови код остальным игрокам</small></div><div class="box"><b>Игроки ('+ps.length+'/4)</b><div style="margin:8px 0">'+(ps.map(p=>'<div>• '+esc(p.name)+(p.id===me?' (ты)':'')+'</div>').join('')||'<span class="c">Пока никого</span>')+'</div>'+
   (!j&&ps.length<4?'<button onclick="doJoin()" style="width:100%">Войти в игру</button>':'')+
   (j?'<button onclick="doStart()" style="width:100%"'+(ps.length<2?' disabled':'')+'>Начать игру</button><p class="msg">'+(ps.length<2?'Ждём остальных игроков…':'Можно начинать!')+'</p>':'')+'</div><div class="box">'+rules+'</div>'+foot;return}
 if(S.phase==='over'){const r=S.players.slice().sort((x,y)=>score(y)-score(x));
  a.innerHTML='<h1>🏆 '+esc(r[0].name)+' победил(а)!</h1><div class="box">'+r.map(p=>'<div class="hd"><b>'+esc(p.name)+'</b><span>⭐ '+score(p)+'</span></div>').join('')+'</div><p class="c"><button onclick="doStart()">Сыграть ещё раз</button></p>'+foot;return}
 const my=mine(),mi=S.players.findIndex(x=>x.id===me);
 let h='<h1>🥕 Огородники · <span class="seas">'+['🌸','☀️','🍂','❄️'][S.season-1]+'</span> '+SEAS[S.season-1]+'</h1><div class="turn">'+(my?(pend==='L'?'Выбери растение в лавке':pend==='R'?'Выбери, у кого украсть':'Твой ход! Выбери место'):'Ходит: '+esc(cur().name))+'</div>';
 if(pend&&my)h+='<p class="c"><button class="alt sm" onclick="cancel()">Отмена</button></p>';
 h+='<div class="msg">'+esc(note||S.msg||'')+'</div><div class="g">'+Object.keys(PL).map(k=>{const q=PL[k],occ=S.places[k],full=occ.length>=q[3];
  return '<div class="pl p'+k+(full?' full':(my&&!pend?' hl':''))+'" onclick="tapPlace(\''+k+'\')"><big>'+q[0]+'</big><b>'+q[1]+'</b><small>'+q[2]+'</small>'+occ.map(id=>'<i>'+esc(nameOf(id))+'</i>').join('')+'</div>'}).join('')+'</div>';
 h+='<h2>🛒 Лавка</h2><div class="mk">'+S.market.map((c,i)=>{const d=CARDS[c],can=my&&pend==='L'&&mi>=0&&afford(S.players[mi],c)&&S.players[mi].garden.length<8;
  return '<div class="cd'+(can?' ok':(pend==='L'?' no':''))+'"'+(can?' onclick="tapBuy('+i+')"':'')+'><big>'+d[0]+'</big><b>'+d[1]+'</b><br><span class="pr">'+cs(d[2])+'</span><br>⭐ '+d[3]+'<br>урожай: '+cs(d[4])+'</div>'}).join('')+'</div>';
 h+='<h2>Игроки</h2>'+S.players.map((p,i)=>playerBox(p,i)).join('');
 if(my&&!pend)h+='<p class="c"><button class="alt sm" onclick="doPass()">Пас (больше не ходить в этом сезоне)</button></p>';
 a.innerHTML=h+'<div class="box">'+rules.replace('details open','details')+'</div>'+foot}

render();
/* Автовозврат в комнату после перезагрузки страницы */
try{const rc=localStorage.getItem('gn-room');if(rc&&nm&&dbOk())listen(rc)}catch(e){}
